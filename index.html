/* Dirección: institucional Anáhuac. Acento naranja comprometido sobre grafito cálido; neutrales teñidos hacia el naranja. Par tipográfico: Bricolage Grotesque (titulares) + IBM Plex Sans (texto). Densidad 6 · Movimiento 4 · Variación 6. Composición asimétrica, alineada a la izquierda. */
:root{
  color-scheme:light;
  --bg:#f4f1ee; --surface:#fffdfb; --surface2:#f7f3ef; --ink:#221c18; --muted:#6b5f57; --line:#e7dfd8; --line2:#d6ccc3;
  --accent:#e2570f; --accent-ink:#ffffff; --accent-soft:#fdebdf; --accent-deep:#b8430a; --link:#b8430a; --gold:#f0a04b;
  --hero-a:#1b1613; --hero-b:#2a211c; --hero-ink:#fbf6f1; --hero-muted:#bfb1a6; --hero-line:rgba(255,240,228,.10);
  --ok:#1f7a4d; --ok-soft:#e3f1e8; --warn:#8a5a00; --warn-soft:#fbf0d9;
  --l0:#1f7a4d; --l1:#2c5fa8; --l2:#9a6a00; --l3:#bf3a2b;
  --paper:#ffffff; --paper-ink:#1d1d1f;
  --shadow:0 1px 0 rgba(34,28,24,.04),0 6px 18px -10px rgba(34,28,24,.22);
  --r:14px; --r-sm:10px;
  --ease:cubic-bezier(.22,1,.36,1);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:var(--f-body);
  --f-serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-sign:'Caveat','Segoe Script','Brush Script MT',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15110f; --surface:#1e1916; --surface2:#26201c; --ink:#f3ece6; --muted:#b0a297; --line:#2f2722; --line2:#3d342e;
    --accent:#ff7a33; --accent-ink:#1a0c03; --accent-soft:#3a2416; --accent-deep:#ff9a5c; --link:#ff9a5c;
    --hero-a:#0f0c0a; --hero-b:#1c1613;
    --ok:#56c98f; --ok-soft:#163023; --warn:#e9be5c; --warn-soft:#33290f;
    --l0:#56c98f; --l1:#7fa8f0; --l2:#e9be5c; --l3:#ff8170;
    --shadow:0 0 0 1px rgba(255,240,228,.04);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15110f; --surface:#1e1916; --surface2:#26201c; --ink:#f3ece6; --muted:#b0a297; --line:#2f2722; --line2:#3d342e;
  --accent:#ff7a33; --accent-ink:#1a0c03; --accent-soft:#3a2416; --accent-deep:#ff9a5c; --link:#ff9a5c;
  --hero-a:#0f0c0a; --hero-b:#1c1613;
  --ok:#56c98f; --ok-soft:#163023; --warn:#e9be5c; --warn-soft:#33290f;
  --l0:#56c98f; --l1:#7fa8f0; --l2:#e9be5c; --l3:#ff8170;
  --shadow:0 0 0 1px rgba(255,240,228,.04);
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(72px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
img{max-width:100%}
.wrap{max-width:1200px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.12;letter-spacing:-.02em}
.ic{flex:none;display:block}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;text-decoration:none}
.skip:focus{left:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Encabezado: banda grafito con gráfica en movimiento */
.hero{position:relative;overflow:hidden;isolation:isolate;margin-top:16px;border-radius:18px;color:var(--hero-ink);background:linear-gradient(160deg,var(--hero-b),var(--hero-a) 70%)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,rgba(0,0,0,.25) 0%,#000 55%);mask-image:linear-gradient(90deg,rgba(0,0,0,.25) 0%,#000 55%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent)}
.hero-in{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:28px 40px;align-items:end;padding:clamp(28px,5vw,56px)}
@media (max-width:860px){.hero-in{grid-template-columns:minmax(0,1fr)}}
.brandline{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted)}
.brandline .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center}
.hero h1{font-size:clamp(38px,6.4vw,74px);font-weight:800;line-height:.98;letter-spacing:-.035em;margin-top:18px;max-width:18ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lede{margin:18px 0 0;max-width:46ch;font-size:clamp(17px,1.8vw,19px);color:var(--hero-muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;background:rgba(255,240,228,.08);border:1px solid var(--hero-line);font-size:14.5px;font-weight:500;color:var(--hero-ink)}
.chip .ic{color:var(--gold)}
.hero-side{align-self:end;display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding:22px;border-radius:14px;background:rgba(15,12,10,.55);border:1px solid var(--hero-line)}
.hero-side .lbl{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--hero-muted)}
.hero-side .val{font-family:var(--f-display);font-size:46px;font-weight:800;line-height:1;letter-spacing:-.03em}
.hero-side .val small{font-size:18px;font-weight:600;color:var(--hero-muted);letter-spacing:0}
.hero-side .hbar{height:6px;border-radius:3px;background:rgba(255,240,228,.12);overflow:hidden}
.hero-side .hbar i{display:block;height:100%;background:var(--accent)}
.hero-side .mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--hero-line);padding-top:14px}
.hero-side .mini b{display:block;font-family:var(--f-display);font-size:24px;font-weight:700}
.hero-side .mini span{font-size:13px;color:var(--hero-muted)}

/* Pestañas: barra subrayada, sólida */
.navrow{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line2);margin-top:8px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav::-webkit-scrollbar{display:none}
nav button{position:relative;display:inline-flex;align-items:center;gap:7px;height:54px;background:none;border:0;padding:0 11px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:transparent;transition:background .2s var(--ease)}
nav button[aria-selected="true"]{color:var(--ink)}
nav button[aria-selected="true"]::after{background:var(--accent)}
nav button[aria-selected="true"] .ic{color:var(--accent)}
main{padding-top:26px}
main:focus{outline:none}

/* Piezas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:18px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--warn);font-size:15px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.icon{width:44px;padding:0}
.btn[disabled]{opacity:.42;cursor:not-allowed}
a.btn{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent-deep);border-color:transparent}
.av{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;background:var(--surface2);border:1px solid var(--line2);color:var(--ink)}
.av.sm{width:34px;height:34px;border-radius:10px;font-size:13px}
.sec-h{display:flex;align-items:center;gap:14px}
.sec-h .badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--ink);color:var(--gold)}
.idx,.eyebrow-s{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep)}

/* Programa */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.stat{display:flex;gap:16px;align-items:center;padding:22px 24px;border-right:1px solid var(--line);margin-right:-1px}
.stat .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-deep);flex:none}
.stat .muted{font-size:14px;font-weight:500}
.stat b{display:block;font-family:var(--f-display);font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.day-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.day-head h2{font-size:clamp(24px,2.8vw,30px)}
.slot{display:grid;grid-template-columns:150px 42px minmax(0,1fr) auto;gap:6px 18px;padding:16px 0;border-top:1px solid var(--line);align-items:center}
.day-head + .slot,.slot.brk + .slot{border-top:0}
.slot .t{display:flex;flex-direction:column;gap:3px;font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.slot .t small{display:flex;align-items:center;gap:5px;color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:13px}
.slot .who{min-width:0}
.slot .who b{display:block;line-height:1.3;font-size:16.5px;font-weight:600}
.slot .who span{display:flex;gap:6px;align-items:flex-start;color:var(--muted);font-size:14.5px;overflow-wrap:anywhere}
.slot .who span .ic{margin-top:3px}
.slot.brk{grid-template-columns:150px minmax(0,1fr);background:var(--surface2);border:1px dashed var(--line2);border-radius:var(--r-sm);margin:6px 0;padding:11px 16px;color:var(--muted);font-weight:500;font-size:15px}
.slot.brk .lbl{display:flex;gap:8px;align-items:center}
.slot.moved .t>span:first-child{color:var(--accent-deep)}
.dots{display:inline-flex;gap:3px;margin-left:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.dots i.on{background:var(--ok)}
@media (max-width:760px){.slot{grid-template-columns:42px minmax(0,1fr)}.slot .t{grid-column:1 / -1;flex-direction:row;gap:10px;align-items:center}.slot>div:last-child{grid-column:1 / -1}.slot.brk{grid-template-columns:minmax(0,1fr)}}
.schrow{display:grid;grid-template-columns:minmax(0,1fr) 180px 150px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:640px){.schrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.schrow>span{grid-column:1 / -1}}

/* Selector de evaluador (un toque) */
.whobar{display:flex;flex-direction:column;gap:10px;padding:16px 18px}
.whobar .wh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.whobar .wh b{font-family:var(--f-display);font-size:18px}
.whobar .wh span{font-size:14px;color:var(--muted)}
.whos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.whobtn{display:flex;align-items:center;gap:10px;flex:none;min-height:52px;padding:6px 14px 6px 6px;border-radius:12px;border:1.5px solid var(--line2);background:var(--surface);text-align:left;max-width:260px}
.whobtn:hover:not([disabled]){border-color:var(--ink)}
.whobtn .tx{min-width:0}
.whobtn b{display:block;font-size:14.5px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.whobtn small{display:block;font-size:12.5px;color:var(--muted);line-height:1.2}
.whobtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.whobtn[aria-pressed="true"] .av{background:var(--accent);border-color:var(--accent);color:#fff}
.whobtn[disabled]{opacity:.5;cursor:not-allowed}

/* Evaluar */
.evgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:920px){.evgrid{grid-template-columns:minmax(0,1fr)}}
.stlist{display:flex;flex-direction:column;gap:2px;padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto}
@media (max-width:920px){.stlist{display:none}}
.stbtn{position:relative;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:10px 12px;display:flex;gap:12px;align-items:center}
.stbtn:hover{background:var(--surface2)}
.stbtn[aria-current="true"]{background:var(--accent-soft)}
.stbtn[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.stbtn[aria-current="true"] .av{background:var(--accent);border-color:var(--accent);color:#fff}
.stbtn .tx{min-width:0;flex:1}
.stbtn b{display:block;font-size:14.5px;line-height:1.3;font-weight:600}
.stbtn .meta{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:3px}
.stsel{display:none}
@media (max-width:920px){.stsel{display:block}}
select,input[type=text],input[type=date],input[type=time],textarea{width:100%;min-height:46px;padding:10px 13px;border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--surface);font-size:16px}
select:focus,input:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea{min-height:116px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
.evnav{display:flex;gap:14px;align-items:center;padding:12px 14px}
.evnav .grow b{display:block;font-size:15px;font-weight:600}
.evnav .grow span{font-size:13px;color:var(--muted)}
.evnav .bar{margin-top:8px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line2);position:relative;margin:0;cursor:pointer;transition:background .2s var(--ease)}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(18px)}
@media (max-width:640px){.evnav{flex-wrap:wrap}.evnav .switch{order:5;width:100%}}
.sticky-score{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:10;overflow:hidden;color:var(--hero-ink);background:linear-gradient(160deg,var(--hero-b),var(--hero-a));border-radius:var(--r);padding:16px 20px 16px 24px;display:flex;gap:16px;align-items:center;justify-content:space-between;box-shadow:0 12px 26px -14px rgba(27,22,19,.6)}
.sticky-score::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.sticky-score h2{font-size:23px}
.sticky-score .muted{color:var(--hero-muted)}
.big{font-family:var(--f-display);font-weight:800;font-size:42px;line-height:1;text-align:right;letter-spacing:-.03em;white-space:nowrap;flex:none}
.big small{font-family:var(--f-body);font-size:15px;color:var(--hero-muted);font-weight:600;letter-spacing:0}
.big .band{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-top:6px}
.crit{display:flex;flex-direction:column;gap:14px}
.crit-h{display:flex;gap:14px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.crit-h .badge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--ink);flex:none}
.crit-h h3{font-size:20px}
.crit-h .pts{margin-left:auto;text-align:right;white-space:nowrap;font-size:14px;color:var(--muted)}
.crit-h .pts b{font-family:var(--f-display);font-size:21px!important}
.lvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.lv{--lc:var(--l0);position:relative;text-align:left;border:1.5px solid var(--line);border-top:4px solid color-mix(in srgb,var(--lc) 45%,var(--line));border-radius:var(--r-sm);background:var(--surface);padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s var(--ease),background .15s var(--ease)}
.lv:hover:not([disabled]){border-color:var(--lc)}
.lv .n{font-size:13px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--lc);display:flex;justify-content:space-between;gap:8px;align-items:center}
.lv .n .num{color:var(--ink);font-family:var(--f-display);font-size:16px;letter-spacing:0}
.lv .d{font-size:14.5px;line-height:1.45;color:var(--muted)}
.lv[aria-checked="true"]{border-color:var(--lc);background:color-mix(in srgb,var(--lc) 9%,var(--surface));box-shadow:inset 0 0 0 1px var(--lc)}
.lv[aria-checked="true"] .d{color:var(--ink)}
.lv[aria-checked="true"] .n>span:first-child::before{content:"✓ ";}
.lv[disabled]{cursor:default}
.sig{border:1.5px dashed var(--line2);border-radius:var(--r);padding:20px 22px;background:var(--surface2);display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
.sig .name{font-family:var(--f-sign);font-size:42px;line-height:1;color:var(--ink)}
.sig .meta{font-size:14px;color:var(--muted);line-height:1.6}
.chooser{display:grid;gap:8px}
.chooser label{display:flex;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;cursor:pointer}
.chooser label:hover{border-color:var(--line2);background:var(--surface2)}
.chooser label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chooser input{accent-color:var(--accent);width:18px;height:18px}

/* Tablas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:15px}
th,td{padding:14px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2);border-bottom:1px solid var(--line2)}
td.num b{font-weight:600}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);min-width:260px;box-shadow:1px 0 0 var(--line)}
thead th:first-child{background:var(--surface2)}
tbody tr:hover td,tbody tr:hover th{background:var(--surface2)}
tr:last-child td,tr:last-child th{border-bottom:0}
td.avg{font-family:var(--f-display);font-weight:800;font-size:25px;letter-spacing:-.02em;min-width:170px}
.draft{color:var(--warn);font-size:13px;font-weight:500}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cellp{display:flex;gap:12px;align-items:center}
.cellp b{display:block;line-height:1.3;font-weight:600}
.cellp .muted{display:block}
.rubric th,.rubric td{text-align:left;vertical-align:top;font-size:14px;line-height:1.5}
.rubric th:first-child,.rubric td:first-child{min-width:210px}
.rubric{min-width:960px}
.rubric td b.num{color:var(--muted);font-weight:600;font-size:13px}
.rubric .ch{display:flex;gap:10px;align-items:center}
.rubric .ch .ic{color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--link);font-weight:600;font-size:14px;display:inline-flex;gap:4px;align-items:center;margin-top:4px}
.linkbtn:hover{text-decoration:underline}

/* Cartas y reportes */
.lgrid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:920px){.lgrid{grid-template-columns:minmax(0,1fr)}}
.segs{display:inline-flex;border:1px solid var(--line2);border-radius:12px;padding:4px;gap:4px;background:var(--surface);max-width:100%;flex-wrap:wrap}
.segs button{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;background:none;padding:9px 16px;font-weight:600;font-size:15px;color:var(--muted)}
.segs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:6px;padding:clamp(24px,5.5vw,60px);font-family:var(--f-serif);font-size:16px;line-height:1.65;box-shadow:0 1px 2px rgba(0,0,0,.05),0 20px 48px -20px rgba(27,22,19,.35);overflow-wrap:anywhere}
.paper::before{content:"";position:absolute;left:clamp(24px,5.5vw,60px);right:clamp(24px,5.5vw,60px);top:0;height:4px;background:var(--accent)}
.paper p{margin:0}
.paper .h1{font-family:var(--f-body);letter-spacing:.08em}
.paper.rep{font-family:var(--f-body);font-size:15.5px;line-height:1.55}
.paper .rtwrap{overflow-x:auto;margin:6pt 0 14pt}
.paper table.rtab{min-width:560px;font-size:13.5px;border:1px solid #d6ccc3}
.paper table.rtab th,.paper table.rtab td{padding:8px 10px;border:1px solid #e7dfd8;position:static;min-width:0;background:transparent;color:#1d1d1f;box-shadow:none;text-transform:none;letter-spacing:0;font-size:13.5px}
.paper table.rtab thead th{background:#f7f3ef;font-weight:600}
.paper table.rtab td:first-child,.paper table.rtab th:first-child{text-align:left}
.paper table.rtab tr.tot td,.paper table.rtab tr.tot th{font-weight:700;background:#fbf8f5}
.paper table.rtab tbody tr:hover td,.paper table.rtab tbody tr:hover th{background:transparent}
.paper table.rtab td:last-child{white-space:nowrap}

/* Accesos */
.acc-intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end}
@media (max-width:760px){.acc-intro{grid-template-columns:minmax(0,1fr)}}
.acc-intro h2,.sec-title h2{font-size:clamp(26px,3vw,34px);margin-top:4px}
.acc-intro p,.sec-title p{margin:8px 0 0;max-width:64ch;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.qcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.qcard .top{display:flex;gap:12px;align-items:center;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.qcard .top b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.2}
.qcard .top span.muted{display:block;font-size:13.5px;line-height:1.35;margin-top:2px}
.qcard .no{margin-left:auto;align-self:flex-start;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--accent-deep)}
.qbody{display:grid;grid-template-columns:136px minmax(0,1fr);gap:16px;padding:18px 20px;align-items:center;flex:1}
.qr{width:136px;height:136px;padding:8px;background:#fff;border:1px solid #e7dfd8;border-radius:10px}
.qr svg{width:100%;height:100%;display:block}
.qmeta{display:flex;flex-direction:column;gap:10px;min-width:0}
.qlink{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;line-height:1.4;padding:8px 10px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;user-select:all}
.qprog{font-size:14px;color:var(--muted)}
.qprog b{color:var(--ink);font-family:var(--f-display);font-size:18px}
.qbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:7px}
.qbar i{display:block;height:100%;background:var(--ok)}
.qact{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px 18px;border-top:1px solid var(--line);background:var(--surface2)}
.qact .btn{flex:1 1 auto;min-height:42px;padding:8px 12px;font-size:14px}
@media (max-width:420px){.qbody{grid-template-columns:minmax(0,1fr)}.qr{margin:0 auto}}
.personal{display:flex;gap:12px;align-items:center;padding:13px 16px;border-radius:var(--r-sm);background:var(--ink);color:var(--bg);font-size:15px}
.personal .ic{color:var(--gold)}

/* Evaluador invitado */
.gfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.req{color:var(--accent-deep)}
.ferr{color:var(--l3);font-size:14px;font-weight:500;display:flex;gap:6px;align-items:center}
.guestnote{display:flex;gap:12px;align-items:flex-start}
.guestnote .ic{color:var(--accent);margin-top:2px}

/* Barra inferior móvil (zona del pulgar) */
.mbar{display:none}
@media (max-width:720px){
  body.on-eval{padding-bottom:calc(108px + env(safe-area-inset-bottom,0px))}
  .mbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:35;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--hero-a);color:var(--hero-ink);box-shadow:0 14px 34px -12px rgba(0,0,0,.5)}
  .mbar .sc{flex:1;min-width:0;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.05}
  .mbar .sc small{display:block;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--hero-muted)}
  .mbar .btn.icon{width:48px;min-height:48px;background:transparent;border-color:rgba(255,240,228,.2);color:var(--hero-ink)}
  .mbar .btn.primary,.mbar .btn.dark{min-height:48px;padding:0 18px}
  .mbar .btn.dark{background:var(--hero-ink);color:var(--hero-a);border-color:var(--hero-ink)}
  .sticky-score{padding:12px 14px 12px 18px}
  .sticky-score h2{font-size:18px}
  .big{font-size:32px}
  .card{padding:18px}
  .hero-in{padding:26px 22px 30px}
  body.on-eval .hero .lede,body.on-eval .hero .chips,body.on-eval .hero-side{display:none}
  body.on-eval .hero h1{font-size:30px;margin-top:10px}
  body.on-eval .hero-in{padding:18px 18px 22px}
}

/* Botones: acabado institucional */
.btn{position:relative;min-height:44px;padding:9px 18px;border-radius:10px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface2) 70%,var(--surface)));color:var(--ink);font-weight:600;font-size:15px;letter-spacing:.005em;
  box-shadow:0 1px 0 rgba(34,28,24,.06),inset 0 1px 0 rgba(255,255,255,.6);transition:background .15s var(--ease),border-color .15s var(--ease),box-shadow .15s var(--ease),transform .1s var(--ease)}
.btn .ic{opacity:.9}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 55%,var(--line2));box-shadow:0 2px 6px -2px rgba(34,28,24,.18),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 1px 2px rgba(34,28,24,.15)}
.btn.primary{background:linear-gradient(180deg,#ee6a24,var(--accent) 55%,#d14c08);border-color:#c4470a;color:#fff;box-shadow:0 1px 0 rgba(120,40,0,.25),0 6px 14px -8px rgba(226,87,15,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{background:linear-gradient(180deg,#f07633,#e05a12 55%,#c44707);border-color:#b8430a;box-shadow:0 1px 0 rgba(120,40,0,.25),0 8px 18px -8px rgba(226,87,15,.8),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.dark{background:linear-gradient(180deg,#3a302a,var(--hero-a));border-color:#14100e;color:var(--hero-ink);box-shadow:0 1px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}
.btn.dark .ic{color:var(--gold)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.btn.danger{background:linear-gradient(180deg,#d4493a,#b8352a);border-color:#a32d23;color:#fff;box-shadow:0 1px 0 rgba(90,20,10,.3),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:9px}
.btn[disabled],.btn[disabled]:hover{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
:root[data-theme="dark"] .btn:not(.primary):not(.dark):not(.danger):not(.ghost){box-shadow:0 1px 0 rgba(0,0,0,.3)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.primary):not(.dark):not(.danger):not(.ghost){box-shadow:0 1px 0 rgba(0,0,0,.3)}}
.btn.icon{width:44px;padding:0}
.linkbtn{border-radius:6px;padding:2px 4px;margin-left:-4px}
.okbox{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--r-sm);background:var(--ok-soft);color:var(--ok);font-weight:500}
/* Coordinación */
.co-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end;background:linear-gradient(160deg,var(--hero-b),var(--hero-a));color:var(--hero-ink);border-color:#000}
.co-top .muted{color:var(--hero-muted)}
.co-top h2{font-size:clamp(26px,3vw,34px);margin-top:4px}
.co-top .eyebrow-s{color:var(--gold)}
.co-top .btn.ghost{color:var(--hero-muted)}
.co-top .btn.ghost:hover{background:rgba(255,240,228,.08);border-color:var(--hero-line);color:var(--hero-ink)}
.co-nav{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
@media (max-width:760px){.co-top{grid-template-columns:minmax(0,1fr)}.co-nav{justify-content:flex-start}}
.co-sec{scroll-margin-top:80px}
.co-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:baseline;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.co-h h3{font-size:22px}
.co-h p{grid-column:2;margin:0}
.co-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.co-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.co-row:first-of-type{border-top:0}
.co-n{font-family:var(--f-display);font-weight:700;color:var(--accent-deep);padding-bottom:12px}
.co-row .av{margin-bottom:4px}
.co-fields{display:grid;gap:10px;min-width:0}
.co-st{grid-template-columns:minmax(0,1.4fr) minmax(0,1.3fr) minmax(0,1fr) 160px 130px}
.co-ev{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:980px){.co-st,.co-ev{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.co-crit{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.co-ch{grid-template-columns:minmax(0,1fr) 120px}
.co-lv{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.co-lv textarea{min-height:84px;font-size:14.5px}
.co-sig{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.co-sig .grow b{display:block}
.co-sig .grow span{display:block}
.co-sec label.f{font-size:13px}
.co-sec input,.co-sec select{min-height:42px;font-size:15px}
.secbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

/* Seguimiento */
.obs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.obs-card{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.obs-top{display:flex;gap:10px;align-items:center}
.obs-top b{display:block;font-size:15px;line-height:1.25}
.obs-top .muted{display:block;line-height:1.3}
.obs-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.obs-nums b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.1}
.obs-nums span{font-size:12.5px;color:var(--muted)}
.obs-tone{color:var(--accent-deep);font-weight:600}
.obs-table td{padding:8px}
.obs-cell{width:100%;min-height:40px;border:1px solid transparent;border-radius:8px;background:none;display:grid;place-items:center}
.obs-cell:hover{background:var(--surface2);border-color:var(--line2)}
.obs-cell.on{border-color:var(--accent);background:var(--accent-soft)}
.ost{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;color:var(--muted)}
.ost.ok{color:var(--ok);background:var(--ok-soft);padding:3px 8px;border-radius:6px}
.ost.dr{color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:6px}
.obs-det{border:1.5px solid var(--accent)}
.obs-row{display:grid;grid-template-columns:minmax(0,1fr) auto 90px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.obs-row b{text-align:right}
.lvtag{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,transparent);padding:3px 9px;border-radius:6px}
.obs-note{margin:0;padding:12px 16px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0;font-style:italic}
/* Modo edición */
.edit-toggle{margin-left:auto;display:flex;align-items:center;padding:0 6px;flex:none}
.edit-toggle .switch{color:var(--ink);font-weight:600}
.edit-toggle .switch input:checked{background:var(--accent)}
.editdock{border:1.5px dashed var(--accent);border-radius:var(--r);background:color-mix(in srgb,var(--accent-soft) 45%,var(--bg));padding:14px}
.editdock>summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;font-weight:700;color:var(--accent-deep);padding:4px 6px}
.editdock>summary::-webkit-details-marker{display:none}
.editdock>summary .ic{color:var(--accent)}
.editdock[open]>summary{margin-bottom:12px}
/* Rúbrica en negro con halos */
.rubdark{background:radial-gradient(120% 80% at 0% 0%,#1d1612 0%,#0b0908 55%),#0b0908;border-radius:18px;padding:clamp(18px,3vw,30px);color:#f4ede7;border:1px solid #000;box-shadow:0 24px 60px -30px rgba(0,0,0,.7)}
.rubdark .rh{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:18px}
.rubdark .rh h2{font-size:clamp(26px,3.2vw,36px);color:#fff}
.rubdark .rh p{margin:6px 0 0;color:#c9bcb2;max-width:60ch}
.rublv{display:flex;flex-wrap:wrap;gap:8px}
.rublv span{--lc:#fff;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--lc);padding:6px 12px;border-radius:99px;border:1px solid color-mix(in srgb,var(--lc) 55%,transparent);background:color-mix(in srgb,var(--lc) 10%,transparent);box-shadow:0 0 18px -4px var(--lc);text-shadow:0 0 12px color-mix(in srgb,var(--lc) 60%,transparent)}
.rubgrid{display:flex;flex-direction:column;gap:12px}
.rubrow{display:grid;grid-template-columns:240px repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
.rubhead{position:relative;padding:16px;border-radius:12px;background:linear-gradient(160deg,#2a211c,#16110e);border:1px solid #3a2e27}
.rubhead .w{display:inline-block;font-family:var(--f-display);font-size:30px;font-weight:800;color:#ff8a45;text-shadow:0 0 22px rgba(255,122,51,.55);line-height:1}
.rubhead .w small{font-size:14px;color:#c9bcb2;font-weight:600;text-shadow:none}
.rubhead b{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:16px;line-height:1.3;color:#fff}
.rubhead .ic{color:#ff8a45}
.rubcell{--lc:#fff;position:relative;padding:14px 14px 16px;border-radius:12px;background:#141110;border:1px solid color-mix(in srgb,var(--lc) 28%,#2a2420);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--lc) 35%,transparent),0 0 0 0 transparent;transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}
.rubcell::before{content:"";position:absolute;left:14px;right:14px;top:-1px;height:2px;border-radius:2px;background:var(--lc);box-shadow:0 0 14px 1px var(--lc)}
.rubcell:hover{border-color:var(--lc);box-shadow:0 0 26px -6px var(--lc)}
.rubcell .pt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lc);text-shadow:0 0 10px color-mix(in srgb,var(--lc) 50%,transparent)}
.rubcell .pt b{font-family:var(--f-display);font-size:20px;letter-spacing:0;color:#fff;text-shadow:0 0 14px color-mix(in srgb,var(--lc) 70%,transparent)}
.rubcell p{margin:8px 0 0;font-size:14.5px;line-height:1.5;color:#ece4dd}
.rubtot{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px solid #3a2e27;color:#c9bcb2;font-size:14.5px}
.rubtot b{color:#fff;font-family:var(--f-display);font-size:22px}
@media (max-width:980px){.rubrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.rubhead{grid-column:1 / -1}}
@media (max-width:520px){.rubrow{grid-template-columns:minmax(0,1fr)}}
/* Halo en la evaluación */
.lv[aria-checked="true"]{box-shadow:inset 0 0 0 1px var(--lc),0 0 0 4px color-mix(in srgb,var(--lc) 14%,transparent),0 10px 24px -12px var(--lc)}

/* Accesos visibles */
.acc-strip{display:flex;flex-direction:column;gap:14px}
.acc-strip .ah{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:end;justify-content:space-between}
.acc-strip .ah h2{font-size:clamp(22px,2.6vw,28px)}
.acc-strip .ah p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.mini-q{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
@media (max-width:420px){.mini-q{grid-template-columns:1fr 1fr;gap:10px}.mq{padding:12px 8px}.mq .qr{width:104px;height:104px}.mq .row .btn:not(.icon){padding:5px 8px}}
.mq{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 14px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);text-align:center}
.mq .qr{width:118px;height:118px;padding:7px}
.mq b{font-size:14.5px;line-height:1.25}
.mq small{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.mq .row{gap:6px;justify-content:center;flex-wrap:nowrap}
.mq .btn.icon.sm{width:36px;flex:none}
.mq .btn.sm{min-height:36px;padding:5px 10px;font-size:13px}
.myqr{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:center;padding:18px;border-radius:var(--r);background:linear-gradient(160deg,var(--hero-b),var(--hero-a));color:var(--hero-ink);border:1px solid #000}
.myqr .qr{width:200px;height:200px;padding:10px;border-radius:12px}
.myqr h3{font-size:22px;color:#fff}
.myqr p{margin:6px 0 12px;color:var(--hero-muted);font-size:14.5px}
.myqr .qlink{background:rgba(255,240,228,.08);border-color:var(--hero-line);color:var(--hero-ink)}
.myqr .row{margin-top:12px}
.myqr .btn:not(.primary){background:transparent;border-color:rgba(255,240,228,.25);color:var(--hero-ink);box-shadow:none}
.myqr .btn:not(.primary):hover{background:rgba(255,240,228,.08)}
@media (max-width:620px){.myqr{grid-template-columns:minmax(0,1fr);justify-items:start}.myqr .qr{width:180px;height:180px}}

/* Encabezado según referencia: logo, lema y tarjetas de navegación */
.hero{background:radial-gradient(42% 60% at 0% 0%,rgba(226,87,15,.55),transparent 70%),radial-gradient(40% 55% at 100% 100%,rgba(226,87,15,.45),transparent 70%),linear-gradient(160deg,#211a16,#0f0c0a 70%)}
.hero canvas{-webkit-mask-image:none;mask-image:none;opacity:.85}
.hero-top{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:24px 40px;align-items:center;padding:clamp(26px,4.5vw,52px) clamp(22px,4.5vw,52px) 0}
@media (max-width:860px){.hero-top{grid-template-columns:minmax(0,1fr)}}
.lockup{display:flex;align-items:center;gap:clamp(16px,3vw,30px)}
.lockup img{width:clamp(96px,14vw,150px);height:auto;flex:none;filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 10px 24px rgba(226,87,15,.35))}
.lockup .wm{min-width:0}
.lockup .uni{font-family:'Roboto Slab',Georgia,serif;font-weight:800;font-size:clamp(30px,4.6vw,54px);line-height:.95;letter-spacing:-.01em;color:#fff;text-transform:uppercase}
.lockup .rule{height:3px;width:min(100%,340px);background:var(--accent);margin:14px 0 12px;border-radius:2px}
.lockup .prog{margin:0;max-width:none;display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(22px,3.3vw,40px);line-height:1;color:var(--accent);text-transform:uppercase;letter-spacing:-.01em;padding-left:14px;border-left:3px solid var(--accent)}
.lockup .lic{display:block;margin-top:8px;padding-left:17px;font-size:clamp(12px,1.3vw,14.5px);letter-spacing:.16em;text-transform:uppercase;color:var(--hero-muted);font-weight:500}
.hero-top .chips{margin-top:20px}
.motto{text-align:center;margin:clamp(22px,3.5vw,36px) 0 0;font-size:clamp(13px,1.5vw,16px);letter-spacing:.42em;text-transform:uppercase;color:#f3ece6;font-weight:500;padding:0 16px}
.hnav{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:clamp(18px,3vw,28px) clamp(22px,4.5vw,52px) clamp(28px,4vw,44px)}
.hcard{display:flex;align-items:center;gap:14px;min-height:76px;padding:12px 14px;border-radius:14px;text-align:left;color:#fff;background:linear-gradient(160deg,rgba(255,240,228,.07),rgba(255,240,228,.02));border:1px solid rgba(255,190,150,.28);transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),transform .15s var(--ease)}
.hcard:hover{border-color:rgba(255,140,70,.75);box-shadow:0 0 22px -6px rgba(255,110,40,.7);transform:translateY(-1px)}
.hcard .ib{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:#ff8a45;background:radial-gradient(circle at 35% 30%,rgba(255,138,69,.28),rgba(120,40,0,.25));border:1px solid rgba(255,138,69,.45)}
.hcard .tx{flex:1;min-width:0}
.hcard b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.2}
.hcard small{display:block;font-size:13px;color:#c9bcb2;line-height:1.3;margin-top:2px}
.hcard .chev{color:#c9bcb2;flex:none}
.hcard[aria-current="page"]{border-color:#ff7a33;background:linear-gradient(160deg,rgba(226,87,15,.34),rgba(226,87,15,.12));box-shadow:0 0 0 1px #ff7a33,0 0 30px -4px rgba(255,110,40,.75)}
.hcard[aria-current="page"] .ib{background:radial-gradient(circle at 35% 30%,#ff9a5c,#c4470a);color:#fff;border-color:#ffb27f}
.hcard.coordc{border-style:dashed}
.hero .hero-side{align-self:center}
@media (max-width:720px){.hnav{grid-template-columns:1fr 1fr;gap:8px}.hcard{min-height:64px;padding:10px;gap:10px}.hcard .ib{width:38px;height:38px}.hcard small,.hcard .chev{display:none}
  body.on-eval .hnav,body.on-eval .motto,body.on-eval .lockup .lic,body.on-eval .hero-top .chips{display:none}
  body.on-eval .lockup img{width:64px}body.on-eval .lockup .uni{font-size:24px}body.on-eval .lockup .prog{font-size:18px}body.on-eval .hero-top{padding-bottom:20px}}

/* ===== Áreas refinadas: accesos, programa y resultados ===== */
/* Accesos personales: panel grafito con tarjetas claras */
.acc-strip{position:relative;overflow:hidden;padding:clamp(20px,3vw,30px);border-radius:18px;color:var(--hero-ink);
  background:radial-gradient(60% 90% at 100% 0%,rgba(226,87,15,.35),transparent 65%),linear-gradient(160deg,#2a211c,#120e0c 75%);border:1px solid #000;box-shadow:0 20px 44px -26px rgba(27,22,19,.75)}
.acc-strip::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,240,228,.07) 1px,transparent 1px);background-size:18px 18px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.acc-strip>*{position:relative;z-index:1}
.acc-strip .ah h2{color:#fff}
.acc-strip .ah p{color:var(--hero-muted)}
.acc-strip .eyebrow-s{color:#ff9a5c}
.mini-q{grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.mq{position:relative;justify-content:space-between;height:100%;padding:18px 14px 14px;border-radius:16px;border:1px solid rgba(255,190,150,.22);background:linear-gradient(180deg,#fffdfb,#f7f1eb);box-shadow:0 10px 24px -16px rgba(0,0,0,.6);color:var(--paper-ink);transition:transform .15s var(--ease),box-shadow .2s var(--ease)}
.mq:hover{transform:translateY(-2px);box-shadow:0 16px 30px -16px rgba(226,87,15,.55)}
.mq .qr{position:relative;border:0;box-shadow:none;background:#fff}
.mq .qr::before{content:"";position:absolute;inset:-5px;pointer-events:none;
  background:linear-gradient(var(--accent),var(--accent)) top left/16px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) top left/3px 16px no-repeat,
  linear-gradient(var(--accent),var(--accent)) top right/16px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) top right/3px 16px no-repeat,
  linear-gradient(var(--accent),var(--accent)) bottom left/16px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) bottom left/3px 16px no-repeat,
  linear-gradient(var(--accent),var(--accent)) bottom right/16px 3px no-repeat,linear-gradient(var(--accent),var(--accent)) bottom right/3px 16px no-repeat}
.mq .who-t{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:62px}
.mq b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#1d1714}
.mq small{color:#6b5f57;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mq .acts{display:grid;grid-template-columns:1fr 36px;gap:6px;width:100%}
.mq .acts .btn{min-height:36px;padding:5px 8px;font-size:13px;white-space:nowrap}
.mq .go{width:100%;min-height:40px;font-size:14.5px;white-space:nowrap}
.mq.guest{background:linear-gradient(180deg,rgba(226,87,15,.16),rgba(226,87,15,.06));border:1.5px dashed rgba(255,140,70,.7);color:#fff}
.mq.guest b{color:#fff}.mq.guest small{color:#d8cbc1}
.mq.guest .ico{width:118px;height:118px;border-radius:14px;display:grid;place-items:center;background:rgba(255,240,228,.06);border:1px solid rgba(255,190,150,.3);color:#ff8a45}
.mq.guest .btn{background:transparent;color:#fff;border-color:rgba(255,190,150,.5);box-shadow:none}
.mq.guest .btn:hover{background:rgba(255,240,228,.1)}
.acc-strip .btn.primary{box-shadow:0 1px 0 rgba(120,40,0,.25),0 10px 24px -10px rgba(255,110,40,.9),inset 0 1px 0 rgba(255,255,255,.25)}

/* Programa: filas con más relieve */
.day-card{padding:0;overflow:hidden}
.day-card .day-head{padding:20px 24px 16px;margin:0;border-bottom:0;background:linear-gradient(180deg,var(--surface2),var(--surface));box-shadow:inset 0 -2px 0 var(--ink)}
.day-card .slots{padding:4px 24px 16px}
.slot{border-radius:12px;padding:14px 12px;margin:0 -12px;border-top:0;position:relative;transition:background .15s var(--ease)}
.slot:not(.brk)+.slot:not(.brk)::before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:var(--line)}
.slot:not(.brk):hover{background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.slot:not(.brk):hover::before,.slot:not(.brk):hover+.slot::before{opacity:0}
.slot .t>span:first-child{display:inline-block;align-self:flex-start;padding:3px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:16px}
.slot.moved .t>span:first-child{background:var(--accent);color:#fff}
.slot .av{background:linear-gradient(160deg,var(--surface),var(--surface2));box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line2)}
.sigpill{display:inline-flex;flex-direction:column;gap:5px;min-width:150px;padding:8px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.sigpill .sg{display:flex;align-items:center;gap:6px}
.sigpill .meter{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.sigpill .meter i{display:block;height:100%;background:var(--ok);border-radius:3px}
.sigpill.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.slot.brk{background:repeating-linear-gradient(135deg,var(--surface2) 0 10px,var(--surface) 10px 20px);border:1px dashed var(--line2);margin:8px -4px}

/* Resultados: tabla con encabezado grafito y columna de promedio destacada */
.res-table{border:1px solid #000;box-shadow:0 18px 40px -28px rgba(27,22,19,.7)}
.res-table thead th{background:linear-gradient(180deg,#2a211c,#16110e);color:#e9ddd3;border-bottom:3px solid var(--accent);font-size:12px;letter-spacing:.08em}
.res-table thead th:first-child{background:linear-gradient(180deg,#2a211c,#16110e)}
.res-table thead th.th-avg{background:linear-gradient(180deg,#c94a0a,#9a3606);color:#fff}
.res-table tbody tr:nth-child(even) td,.res-table tbody tr:nth-child(even) th{background:color-mix(in srgb,var(--surface2) 70%,var(--surface))}
.res-table tbody tr:hover td,.res-table tbody tr:hover th{background:color-mix(in srgb,var(--accent-soft) 60%,var(--surface))}
.res-table td.avg{background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))!important;border-left:1px solid color-mix(in srgb,var(--accent) 25%,var(--line))}
.res-table .draft{display:inline-block;white-space:nowrap;padding:4px 8px;border-radius:8px;background:var(--warn-soft);font-style:normal}
.res-table .empty{display:inline-block;width:18px;height:2px;border-radius:2px;background:var(--line2);vertical-align:middle}
.res-table .score{display:inline-flex;align-items:center;justify-content:center;min-width:46px;padding:4px 8px;border-radius:8px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.res-table .pend{display:inline-block;padding:4px 10px;border-radius:8px;font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted);background:var(--surface);border:1px dashed var(--line2)}
.repbtn{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 10px;border-radius:8px;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line2));background:var(--surface);color:var(--accent-deep);font-weight:600;font-size:13px;transition:background .15s var(--ease),border-color .15s var(--ease)}
.repbtn:hover{background:var(--accent-soft);border-color:var(--accent)}
@media (max-width:440px){.mini-q{grid-template-columns:1fr 1fr;gap:10px}.mq{padding:14px 10px 10px}.mq .qr{width:104px;height:104px}.mq .acts .btn:not(.icon){font-size:0;gap:0}.mq .acts .btn:not(.icon) .ic{width:16px;height:16px}.mq.guest .ico{width:104px;height:104px}}

[hidden]{display:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;font-size:15px;font-weight:500;z-index:40;max-width:90vw;box-shadow:0 12px 30px rgba(0,0,0,.25)}
@media (max-width:720px){body.on-eval #toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    return '<button class="whobtn" data-act="quickwho" data-k="'+e.k+'" aria-pressed="'+on+'"'+(t?' disabled title="Ya lo usa otra cuenta"':'')+'><span class="av sm">'+esc(e.guest?'INV':ini(e.n))+'</span><span class="tx"><b>'+esc(e.guest?'Invitado (empresa)':e.n.split(' ').slice(0,2).join(' '))+'</b><small>'+(t?'En uso por otra cuenta':e.guest?'Representante de empresa':n+' de '+ST.length+' firmadas')+'</small></span></button>';}).join('');
  return '<section class="card whobar" aria-label="Evaluador"><div class="wh"><b>Evaluando como '+esc(label)+'</b>'+(isGuest(w)?'':'<button class="btn sm" data-act="myqr" aria-expanded="'+!!S.showMy+'">'+ic('qr',16)+(S.showMy?'Ocultar mi liga y QR':'Mi liga y QR')+'</button>')+'<span style="flex-basis:100%">Toca otro nombre para cambiar de evaluador al instante. Cada firma se queda con quien la hizo.</span></div><div class="whos" role="group" aria-label="Elegir evaluador">'+btns+'</div></section>';
}
function chooserView(){
  var bw=byWho(), mine=who();

    var taken=takenBy(e.k);
    return '<label><input type="radio" name="whoSel" value="'+e.k+'"'+(taken?' disabled':'')+(mine===e.k?' checked':'')+'><span class="av sm">'+esc(ini(e.n))+'</span><span><b>'+esc(e.n)+'</b><br><span class="muted small">'+esc(e.cargo)+(taken?' · ya registrada con otra cuenta':'')+'</span></span></label>';
  }).join('');
  return '<section class="card stack" style="max-width:640px"><div class="sec-h"><span class="badge">'+ic('user',20)+'</span><div><h2 style="font-size:24px">¿Quién evalúa?</h2><p class="muted" style="margin:4px 0 0">Elige tu nombre para registrar tus evaluaciones y firmarlas.</p></div></div>'+
   '<div class="chooser" id="whoSel">'+opts+'</div><p class="muted small" style="margin:0">Al elegir tu nombre entras directo a tus evaluaciones.</p></section>';

function viewEvaluar(){
  var w=who();
  var banner=(S.mode==='local')?'<div class="notice">'+ic('info',18)+'<span>'+(window.claude?'Modo local: tus evaluaciones se guardan solo en este navegador y no llegan al promedio compartido. Para firmar en el registro común, abre esta página con tu sesión de Claude.':'Versión web: tus evaluaciones y firmas se guardan en este navegador. Para reunir todo el jurado, usa el respaldo (.json) o la versión en Claude.')+'</span></div>':'';
  if(!w)return '<div class="stack">'+banner+chooserView()+'</div>';
  var me=evByK(w), d=myData()||{evals:{}}, s=stById(S.sid);
  var ev=(d.evals&&d.evals[s.id])||{lv:{},note:'',signedAt:null};
  var signed=!!ev.signedAt, tot=score(ev), ok=complete(ev), miss=CRIT.filter(function(c){return !(ev.lv&&ev.lv[c.id]!=null);}).length;
  var anySigned=d.evals&&Object.keys(d.evals).some(function(k){return d.evals[k].signedAt;});
  var canSwitch=true, isG=!!me.guest;

  var list=ST.map(function(x){
    var e=d.evals&&d.evals[x.id], st=e&&e.signedAt?'<span class="pill ok">'+ic('check',13)+fmt(score(e))+'</span>':started(e)?'<span class="pill warn">Borrador</span>':'<span class="pill">Pendiente</span>';
    return '<button class="stbtn" data-act="pick" data-sid="'+x.id+'"'+(x.id===s.id?' aria-current="true"':'')+'><span class="av sm">'+esc(ini(x.n))+'</span><span class="tx"><b>'+esc(x.n)+'</b><span class="meta"><span class="num">'+x.h+' h</span>'+st+'</span></span></button>';
  }).join('');
  var sel='<select id="selSid" data-sel="sid" aria-label="Practicante">'+ST.map(function(x){return '<option value="'+x.id+'"'+(x.id===s.id?' selected':'')+'>'+esc(x.n)+'</option>';}).join('')+'</select>';

  var crit=CRIT.map(function(c){
    var cur=ev.lv?ev.lv[c.id]:null;
    var pts=cur!=null?c.w*LV[cur].f:null;
    return '<section class="card crit"><div class="crit-h"><span class="badge">'+ic(CICON[c.id],20)+'</span><h3>'+esc(c.t)+'</h3><span class="pts num"><b style="color:var(--ink);font-size:16px">'+(pts!=null?fmt(pts):'–')+'</b> / '+c.w+' pts</span></div>'+
     '<div class="lvs" role="radiogroup" aria-label="'+esc(c.t)+'">'+LV.map(function(l,i){
       return '<button class="lv" id="lv-'+c.id+'-'+i+'" style="--lc:'+LVC[i]+'" role="radio" tabindex="'+((cur===i||(cur==null&&i===0))?0:-1)+'" aria-checked="'+(cur===i)+'" data-act="lv" data-c="'+c.id+'" data-i="'+i+'"'+(signed?' disabled':'')+'><span class="n"><span>'+l.n+'</span><span class="num">'+fmt(c.w*l.f)+'</span></span><span class="d">'+esc(c.d[i])+'</span></button>';
     }).join('')+'</div></section>';
  }).join('');

  var sign;
  if(signed){
    var verified=S.mode==='db'&&S.names[S.uid]?'<br>Cuenta verificada: '+esc(S.names[S.uid]):'';
    sign='<div class="sig"><div><div class="name">'+esc(isG?((ev.gn||'').trim()||me.n):me.n)+'</div><div class="meta">'+esc(isG?cargoOf({e:me,ev:ev},s):me.cargo)+'</div></div>'+
      '<div class="meta"><span class="pill ok">'+ic('check',13)+'Evaluación firmada</span><br>'+esc(fdate(ev.signedAt))+'<br>Folio '+esc(ev.folio||'')+verified+'</div>'+
      '<button class="btn" data-act="unsign">'+ic('undo',18)+'Retirar firma para corregir</button></div>';
  }else{
    sign='<div class="sig"><div class="meta" style="max-width:420px">'+(ok?'Tu calificación para este practicante es <b>'+fmt(tot)+' / 100</b>. Al firmar queda registrada con tu nombre y la hora.':'Te falta calificar <b>'+miss+' de '+CRIT.length+'</b> criterios. Si firmas ahora te llevamos al primero pendiente.')+'</div>'+
      '<button class="btn primary" data-act="sign">'+ic('pen',18)+'Firmar evaluación</button></div>';
  }
  var idx=ST.indexOf(s), nxt=ST[(idx+1)%ST.length], prv=ST[(idx-1+ST.length)%ST.length];
  var doneN=ST.filter(function(x){var e=d.evals&&d.evals[x.id];return e&&e.signedAt;}).length;
  var evnav='<div class="card evnav"><button class="btn icon" data-act="pick" data-sid="'+prv.id+'" aria-label="Practicante anterior: '+esc(prv.n)+'">'+ic('prev',20)+'</button>'+
    '<div class="grow"><b>Practicante '+(idx+1)+' de '+ST.length+'</b><span>'+doneN+' de '+ST.length+' evaluaciones firmadas</span><div class="bar" role="progressbar" aria-label="Avance de tus evaluaciones" aria-valuemin="0" aria-valuemax="'+ST.length+'" aria-valuenow="'+doneN+'"><i style="width:'+Math.round(doneN/ST.length*100)+'%"></i></div></div>'+
    '<label class="switch"><input type="checkbox" data-auto="1"'+(S.auto?' checked':'')+'> Avanzar al firmar</label>'+
    '<button class="btn icon" data-act="pick" data-sid="'+nxt.id+'" aria-label="Siguiente practicante: '+esc(nxt.n)+'">'+ic('arrow',20)+'</button></div>';

  var gdef={gn:ev.gn!=null?ev.gn:((S.lf[s.id]&&S.lf[s.id].rep)||s.rep||''),gc:ev.gc!=null?ev.gc:((S.lf[s.id]&&S.lf[s.id].cargo)||''),ge:ev.ge!=null?ev.ge:((S.lf[s.id]&&S.lf[s.id].emp)||s.e)};
  var gcard=isG?'<section class="card stack" aria-labelledby="gtitle"><div class="guestnote">'+ic('building',20)+'<div><h3 id="gtitle" style="font-size:21px">Datos del evaluador invitado</h3><p class="muted small" style="margin:4px 0 0">Representante de la empresa donde '+esc(s.n.split(' ')[0])+' hizo sus prácticas. Tu nombre aparecerá en la firma y en el reporte.</p></div></div>'+
    '<div class="gfields"><label class="f" for="gf_gn">Nombre completo <span class="req" aria-hidden="true">*</span><input type="text" id="gf_gn" data-gf="gn" autocomplete="name" required aria-required="true" value="'+esc(gdef.gn)+'"'+(signed?' disabled':'')+'></label>'+
    '<label class="f" for="gf_gc">Cargo<input type="text" id="gf_gc" data-gf="gc" autocomplete="organization-title" value="'+esc(gdef.gc)+'"'+(signed?' disabled':'')+'></label>'+
    '<label class="f" for="gf_ge">Empresa<input type="text" id="gf_ge" data-gf="ge" autocomplete="organization" value="'+esc(gdef.ge)+'"'+(signed?' disabled':'')+'></label></div>'+
    '<div class="ferr" id="gf_err" hidden>'+ic('info',16)+'<span>Escribe tu nombre completo para poder firmar.</span></div></section>':'';
  var mbar='<div class="mbar" role="toolbar" aria-label="Acciones rápidas"><button class="btn icon" data-act="pick" data-sid="'+prv.id+'" aria-label="Practicante anterior">'+ic('prev',20)+'</button><div class="sc num">'+fmt(tot)+'<small>de 100 · '+(signed?'firmada':ok?'lista para firmar':miss+' criterios pendientes')+'</small></div>'+
    (signed?'<button class="btn dark" data-act="pick" data-sid="'+nxt.id+'">Siguiente '+ic('arrow',18)+'</button>':'<button class="btn primary" data-act="sign">'+ic('pen',18)+'Firmar</button>')+'</div>';
  var pb=(S.personal&&S.personal===w)?'<div class="personal">'+ic('link',18)+'<span>Acceso personal de <b>'+esc(me.n)+'</b>. Tus calificaciones y firmas se guardan con tu nombre.</span></div>':'';
  return '<div class="stack">'+banner+pb+
   whoBar(w,isG?((ev.gn||'').trim()||me.n):me.n)+(S.showMy?myAccess(w):'')+
   '<div class="evgrid"><aside class="card stlist" aria-label="Practicantes">'+list+'</aside><div class="stack" style="min-width:0">'+
   '<div class="stsel">'+sel+'</div>'+evnav+
   '<div class="sticky-score"><div style="min-width:0"><h2>'+esc(s.n)+'</h2><span class="muted small">'+esc(s.e)+' · '+sdate(s.d)+' · '+s.h+' h</span></div><div class="big num">'+fmt(tot)+'<small> / 100</small><span class="band">'+(ok?band(tot):'En curso')+'</span></div></div>'+
   gcard+crit+
   '<section class="card stack"><label class="f" for="note">Comentarios para el practicante (opcional)</label><textarea id="note" data-note="1"'+(signed?' disabled':'')+' placeholder="Fortalezas, áreas de oportunidad, recomendaciones">'+esc(ev.note||'')+'</textarea>'+sign+
   '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="pick" data-sid="'+nxt.id+'">Siguiente: '+esc(nxt.n.split(' ')[0])+ic('arrow',18)+'</button></div></section>'+
   '</div></div>'+mbar+'</div>';
}

function viewResultados(){
  var bw=byWho(), all=0, nrows=0, sum=0;
  var head='<tr><th scope="col">Practicante y empresa</th>'+EVALS.map(function(e){return '<th scope="col">'+esc(e.guest?'Invitado (empresa)':e.s)+'</th>';}).join('')+'<th scope="col" class="th-avg">Promedio</th></tr>';
  var body=ST.map(function(s){
    var vals=[], cells=EVALS.map(function(e){
      var ev=bw[e.k]&&bw[e.k].evals&&bw[e.k].evals[s.id];
      if(ev&&ev.signedAt){var v=score(ev);vals.push(v);all++;return '<td class="num"><span class="score">'+fmt(v)+'</span></td>';}
      if(started(ev))return '<td><span class="draft">en borrador</span></td>';
      return '<td><span class="empty" role="img" aria-label="Sin evaluar"></span></td>';
    }).join('');
    var avg=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
    if(avg!=null){sum+=avg;nrows++;}
    var cell=avg==null?'<td class="avg"><span class="pend">Sin firmas aún</span></td>':'<td class="avg num">'+fmt(avg)+'<div class="bar"><i style="width:'+Math.min(100,avg)+'%"></i></div><div class="small muted" style="font-family:var(--f-body);font-weight:500;margin-top:4px">'+band(avg)+' · '+vals.length+' de '+EVALS.length+(vals.length<EVALS.length?' (parcial)':'')+'</div></td>';
    return '<tr><th scope="row" style="font-weight:400;font-size:15px;color:var(--ink)"><div class="cellp"><span class="av sm">'+esc(ini(s.n))+'</span><div><b>'+esc(s.n)+'</b><span class="muted small">'+esc(s.e)+'</span><button class="repbtn" data-act="toreport" data-sid="'+s.id+'" aria-label="Ver reporte de '+esc(s.n)+'">'+ic('file',14)+'Ver reporte</button></div></div></th>'+cells+cell+'</tr>';
  }).join('');
  var note=S.mode==='local'?'<div class="notice">'+ic('info',18)+'<span>'+(window.claude?'Estás viendo solo lo guardado en este navegador. Con tu sesión de Claude se muestran las firmas de todos los evaluadores.':'Estás viendo lo guardado en este navegador.')+'</span></div>':'';
  return '<div class="stack">'+note+'<div class="stats">'+stat('pen','Evaluaciones firmadas',all+' de '+(ST.length*EVALS.length))+stat('award','Promedio del grupo (con firmas)',nrows?fmt(sum/nrows):'–')+'</div>'+
   '<div class="secbar">'+coordBtn('firmas','Gestionar firmas')+'<button class="btn dark" data-act="csv"'+(S.dwn?'':' disabled')+'>'+ic('download',18)+'Exportar a Excel (.csv)</button></div>'+
   '<div class="tablewrap res-table"><table><caption class="sr">Calificaciones firmadas por practicante y evaluador</caption><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
   '<p class="muted small" style="margin:0">Solo cuentan las evaluaciones firmadas. El promedio es la media de las calificaciones de los evaluadores que ya firmaron, sobre 100 puntos.</p></div>';
}

function viewRubrica(){
  var wsum=CRIT.reduce(function(a,c){return a+(+c.w||0);},0);
  var rows=CRIT.map(function(c,ix){return '<div class="rubrow" role="row"><div class="rubhead" role="rowheader"><span class="w num">'+c.w+'<small> pts</small></span><b>'+ic(CICON[c.id],18)+esc(c.t)+'</b></div>'+
    c.d.map(function(t,i){return '<div class="rubcell" role="cell" style="--lc:'+RLC[i]+'"><div class="pt"><span>'+LV[i].n+'</span><b class="num">'+fmt(c.w*LV[i].f)+'</b></div><p>'+esc(t)+'</p></div>';}).join('')+'</div>';}).join('');
  return '<div class="stack">'+(isCoord()?'<div class="secbar">'+coordBtn('rubrica','Editar rúbrica')+'</div>':'')+
   '<section class="rubdark" aria-labelledby="rubT"><div class="rh"><div><span class="eyebrow-s" style="color:#ff9a5c">Rúbrica de evaluación</span><h2 id="rubT">Siete criterios, cuatro niveles.</h2><p>Cada nivel otorga un porcentaje del peso del criterio. La calificación final es la suma, sobre '+wsum+' puntos.</p></div>'+
   '<div class="rublv">'+LV.map(function(l,i){return '<span style="--lc:'+RLC[i]+'">'+l.n+' · '+Math.round(l.f*100)+'%</span>';}).join('')+'</div></div>'+
   '<div class="rubgrid" role="table" aria-label="Rúbrica por criterio y nivel">'+rows+'</div>'+
   '<div class="rubtot"><span>Total <b class="num">'+wsum+' pts</b></span><span>Sobresaliente 90 a 100 · Satisfactorio 75 a 89.9 · Básico 60 a 74.9 · Insuficiente menos de 60</span></div></section>'+
   '<p class="muted small" style="margin:0">Cada evaluador califica los siete criterios, firma y el sistema promedia las evaluaciones firmadas de cada practicante.</p></div>';
}

/* ---------- Cartas ---------- */
function lfFor(s){
  var o=S.lf[s.id]||{};function g(k,d){return o[k]!=null?o[k]:d;}
  return {emp:g('emp',s.e),rep:g('rep',s.rep||''),cargo:g('cargo',''),fecha:g('fecha',dayLabel(s.d)),hora:g('hora',s.h?s.h+' h':''),lugar:g('lugar',S.sched.venue)};
}
function sigBlock(){
  return [
   {t:'Atentamente,',before:240,after:720},
   {t:'Mtra. Tania Rivera Lozano',b:true,after:0},
   {t:'Coordinadora de la Licenciatura en Administración y Dirección de Empresas',after:0},
   {t:'Escuela Internacional de Negocios',after:0},
   {t:'Universidad Anáhuac Cancún',after:0}
  ];
}
function letterHead(){
  return [
   {t:'UNIVERSIDAD ANÁHUAC CANCÚN',b:true,sz:14,col:'C8470A',after:0,cls:'h1'},
   {t:'Escuela Internacional de Negocios',sz:10,col:'5D5D63',after:0},
   {t:'Licenciatura en Administración y Dirección de Empresas',sz:10,col:'5D5D63',after:360},
   {t:'Cancún, Quintana Roo, a '+(S.fecha||today()),a:'right',after:300}
  ];
}
function companyLetter(s){
  var f=lfFor(s), emp=f.emp||'su empresa', rep=(f.rep||'').trim();
  var hora=f.hora?f.hora:'por confirmar (última exposición de la jornada)';
  var p=letterHead();
  p.push({t:rep||'Representante de '+emp,b:true,after:0});
  if(f.cargo)p.push({t:f.cargo,after:0});
  p.push({t:emp,after:300});
  p.push({t:[{t:'Asunto: ',b:true},{t:'Invitación a la presentación final de prácticas profesionales'}],after:240});
  p.push({t:rep?'Estimado(a) '+rep+':':'Estimado(a) representante:',after:200});
  p.push({t:'Reciba un cordial saludo de la Licenciatura en Administración y Dirección de Empresas de la Universidad Anáhuac Cancún. Le escribimos con sincero agradecimiento por la confianza y el acompañamiento que '+emp+' brindó a '+s.n+' durante su periodo de prácticas profesionales.',a:'both',after:200});
  p.push({t:'Como cierre de esta experiencia, '+s.n+' presentará los resultados de su trabajo ante un jurado conformado por especialistas de nuestra Universidad. Será un honor contar con su presencia en la siguiente sesión:',a:'both',after:160});
  p.push({t:[{t:'Fecha: ',b:true},{t:f.fecha}],after:0,ind:360});
  p.push({t:[{t:'Hora: ',b:true},{t:hora}],after:0,ind:360});
  p.push({t:[{t:'Lugar: ',b:true},{t:f.lugar}],after:200,ind:360});
  p.push({t:'La exposición dura 10 minutos y va seguida de 10 minutos de comentarios del jurado. Su mirada como representante de la empresa enriquece mucho este diálogo, y con gusto le invitamos a acompañar a nuestro estudiante durante su presentación. Para la ocasión sugerimos vestimenta formal de negocios y llegar unos minutos antes de la hora indicada.',a:'both',after:200});
  p.push({t:'Además, le invitamos a participar como evaluador invitado: al terminar la exposición podrá registrar su valoración del practicante en la plataforma digital, con la misma rúbrica que utiliza el jurado.',a:'both',after:120});
  p.push({t:[{t:'Su acceso como evaluador invitado: ',b:true},{t:evLink(evByK('invitado'),s.id)}],after:200});
  p.push({t:'Le agradeceremos confirmar su asistencia con la Coordinación de la Licenciatura. Reiteramos nuestro reconocimiento por su apoyo en la formación de nuestros estudiantes y quedamos atentos a cualquier duda.',a:'both',after:160});
  return {file:'Invitacion_Empresa_'+s.id+'.docx',paras:p.concat(sigBlock())};
}
function evaluatorLetter(e){
  var tit=e.g==='f'?'Estimada':'Estimado', p=letterHead();
  p.push({t:e.n,b:true,after:0});
  p.push({t:e.cargo,after:0});
  p.push({t:e.area,after:300});
  p.push({t:[{t:'Asunto: ',b:true},{t:'Invitación como evaluador(a) en las Presentaciones Finales de Prácticas Profesionales'}],after:240});
  p.push({t:tit+' '+e.n+':',after:200});
  p.push({t:'Reciba un cordial saludo de la Licenciatura en Administración y Dirección de Empresas de la Universidad Anáhuac Cancún. Con motivo del cierre de las prácticas profesionales, nos da mucho gusto invitarle a formar parte del jurado evaluador. Su experiencia y su mirada desde '+e.area+' serán de gran valor para acompañar a nuestros estudiantes en este momento clave de su formación.',a:'both',after:200});
  p.push({t:'Las sesiones serán las siguientes:',after:120});
  daysSummary().forEach(function(l){p.push({t:[{t:l.label,b:true},{t:l.text}],after:60,ind:360});});
  p.push({t:[{t:'Lugar: ',b:true},{t:S.sched.venue+'.'}],after:200,ind:360});
  p.push({t:'Cada practicante expone durante 10 minutos y recibe 10 minutos de retroalimentación del jurado. Cada evaluador registrará su valoración en la plataforma digital con una rúbrica de 100 puntos y firmará su evaluación; al final se emitirá la calificación promediada de cada practicante. Los criterios son:',a:'both',after:120});
  CRIT.forEach(function(c){p.push({t:'•  '+c.t+' ('+c.w+' pts)',after:20,ind:360});});
  p.push({t:[{t:'Su acceso personal a la plataforma de evaluación: ',b:true},{t:evLink(e)}],a:'left',before:200,after:160});
  p.push({t:'Para la ocasión sugerimos vestimenta formal de negocios. Le agradeceremos confirmar su participación con la Coordinación de la Licenciatura; quedamos atentos a cualquier duda.',a:'both',after:160});
  p.push({t:'Agradecemos de antemano su tiempo y su generosidad al acompañar a nuestros estudiantes.',a:'both',after:160});
  return {file:'Invitacion_Evaluador_'+e.k+'.docx',paras:p.concat(sigBlock())};
}
function tblRows(T){return T.rows.map(function(r){return Array.isArray(r)?{cells:r}:r;});}
function tableHTML(T){
  var h='<div class="rtwrap"><table class="rtab"><thead><tr>'+T.head.map(function(c,i){return '<th scope="col"'+(i?' style="text-align:center"':'')+'>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>';
  h+=tblRows(T).map(function(r){return '<tr'+(r.tot?' class="tot"':'')+'>'+r.cells.map(function(c,i){return i?'<td style="text-align:center">'+esc(c)+'</td>':'<th scope="row" style="font-weight:'+(r.tot?700:500)+'">'+esc(c)+'</th>';}).join('')+'</tr>';}).join('');
  return h+'</tbody></table></div>';
}
function paraHTML(p){
  if(p.table)return tableHTML(p.table);

function tableXml(T){

    '<w:tr><w:trPr><w:tblHeader/></w:trPr>'+T.head.map(function(c,i){return cell(c,i,true);}).join('')+'</w:tr>'+

/* ---------- Accesos y QR ---------- */
function qrMatrix(text){var q=qrcode(0,'M');q.addData(text);q.make();return q;}
function qrSVG(text){
  if(!window.qrcode)return '<span class="muted small">QR no disponible</span>';
  var q=qrMatrix(text),n=q.getModuleCount(),d='';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+='M'+c+' '+r+'h1v1h-1z';
  return '<svg viewBox="0 0 '+n+' '+n+'" shape-rendering="crispEdges" role="img" aria-label="Código QR"><path d="'+d+'" fill="#0e1220"/></svg>';
}
function qrPNG(e,sid){
  return new Promise(function(res){
    var st=sid?stById(sid):null,title=st?'Invitado · '+st.n:e.n;
    var q=qrMatrix(evLink(e,sid)),n=q.getModuleCount(),cell=12,pad=56,W=n*cell+pad*2,H=W+150;
    var cv=document.createElement('canvas');cv.width=W;cv.height=H;var x=cv.getContext('2d');
    x.fillStyle='#ffffff';x.fillRect(0,0,W,H);
    x.fillStyle='#e2570f';x.fillRect(0,0,W,10);
    var am=document.getElementById('aMark');if(am&&am.complete){try{x.drawImage(am,W/2-24,14,48,43);}catch(err){}}
    x.fillStyle='#0e1220';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))x.fillRect(pad+c*cell,pad+r*cell,cell,cell);
    x.textAlign='center';x.font='700 30px "Outfit","Segoe UI",sans-serif';
    x.font=(title.length>30?'700 24px':'700 30px')+' "Inter","Segoe UI",sans-serif';x.fillText(title,W/2,W+30);
    x.fillStyle='#4a5165';x.font='500 20px "Inter","Segoe UI",sans-serif';
    x.fillText(st?st.e:'Evaluación de Prácticas Profesionales · ADE',W/2,W+68);
    x.fillText('Universidad Anáhuac Cancún',W/2,W+98);
    cv.toBlob(res,'image/png');
  });
}

async function boot(){
  routeHash();
  document.addEventListener('qrready',function(){if(S.tab==='accesos')render();});
  window.addEventListener('hashchange',function(){if(routeHash())render();});
  S.fecha=today();loadLocal();applySched();render();
  var c=window.claude;if(!c||!c.use){S.dwn=WEB_DWN;S.ready=true;render();return;}
  var r=await Promise.all([c.use('db'),c.use('user'),c.use('downloads')]).catch(function(){return [null,null,null];});
  S.dwn=r[2]||null;
  var db=r[0],user=r[1],uid=null;
  if(db&&user){try{uid=await user.id();}catch(e){uid=null;}}
  if(db&&uid){
    S.mode='db';S.db=db;S.uid=uid;S.user=user;S.ref=db.doc('evals/'+uid);S.schedRef=db.doc('config/schedule');
    S.canEdit=false;try{S.canEdit=!!(await user.canEdit());}catch(e){}
    S.schedRef.onSnapshot(function(sn){var x=sn.exists?sn.data():null;if(x){S.sched=Object.assign({venue:VENUE0,cs:'10:00',ce:'10:20',slots:{}},x);applySched();softRender();}},function(){});
    var timer=setTimeout(function(){S.mode='local';S.dbErr=true;S.ready=true;render();},10000);
    db.collection('evals').onSnapshot(function(snap){
      clearTimeout(timer);S.ready=true;S.docs={};snap.docs.forEach(function(d){var x=d.data();if(x)S.docs[d.id]=x;});
      var mine=S.docs[S.uid];if(S.pending){if(!mine||(mine.updatedAt||'')<(S.pending.updatedAt||''))S.docs[S.uid]=JSON.parse(JSON.stringify(S.pending));else S.pending=null;}
      for(var id in S.docs){if(S.docs[id])S.docs[id].uid=id;}
      softRender();
      user.profiles(Object.keys(S.docs).concat([uid])).then(function(ps){Object.keys(ps).forEach(function(k){S.names[k]=ps[k].name||'';});softRender();}).catch(function(){});
    },function(){clearTimeout(timer);S.mode='local';S.dbErr=true;S.ready=true;render();});
  }else{S.ready=true;}
  render();
}

/* ---------- Gráfica en movimiento del encabezado ---------- */
(function(){
  var cv=document.getElementById('heroCanvas');if(!cv||!cv.getContext)return;
  var x=cv.getContext('2d'),W=0,H=0,dpr=Math.min(window.devicePixelRatio||1,2),t=0,raf=null;
  var still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function dark(){var r=document.documentElement.getAttribute('data-theme');if(r)return r==='dark';return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;}
  function size(){var r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);x.setTransform(dpr,0,0,dpr,0,0);}
  function f(px,py,tt){return Math.sin(px*.005+tt)*30+Math.sin(px*.011-py*.004+tt*1.3)*15+Math.cos(py*.01+px*.002-tt*.7)*10;}
  function draw(){
    x.clearRect(0,0,W,H);
    var dk=true,base='255,240,228',lines=26;
    for(var i=0;i<lines;i++){
      var k=i/(lines-1),y0=H*(.05+k*1.0),hot=(i===11||i===19);
      x.beginPath();
      for(var px=-10;px<=W+10;px+=8){var py=y0+f(px,y0,t+i*.12)*(0.5+k*.7);if(px===-10)x.moveTo(px,py);else x.lineTo(px,py);}
      var g=x.createLinearGradient(0,0,W,0);
      if(hot){g.addColorStop(0,'rgba(226,87,15,0)');g.addColorStop(.25,'rgba(226,87,15,.75)');g.addColorStop(.75,'rgba(255,140,60,.75)');g.addColorStop(1,'rgba(226,87,15,0)');}
      else{var a=(dk?.10:.07)+k*(dk?.10:.08);g.addColorStop(0,'rgba('+base+',0)');g.addColorStop(.3,'rgba('+base+','+a.toFixed(3)+')');g.addColorStop(.7,'rgba('+base+','+a.toFixed(3)+')');g.addColorStop(1,'rgba('+base+',0)');}
      x.strokeStyle=g;x.lineWidth=hot?2:1;x.stroke();
    }
  }
  function loop(){t+=.005;draw();raf=requestAnimationFrame(loop);}
  size();draw();
  window.addEventListener('resize',function(){size();draw();});
  if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
  if(!still){
    if('IntersectionObserver' in window){new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){if(!raf)loop();}else{cancelAnimationFrame(raf);raf=null;}});}).observe(cv);}
    else loop();
  }
})();
})();
